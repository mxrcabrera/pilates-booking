name: Database Backup

on:
  schedule:
    # Ejecutar diariamente a las 03:00 AM UTC
    - cron: '0 3 * * *'
  # Permitir ejecución manual
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      
      - name: Database Backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Exportar estructura (schema) de la base de datos
          supabase db dump --db-url "$DATABASE_URL" -f schema.sql
          
          # Exportar datos reales de la base de datos (usando COPY para velocidad y eficiencia)
          supabase db dump --db-url "$DATABASE_URL" --data-only --use-copy -f data.sql
          
          # Verificar que los archivos se crearon y no están vacíos
          if [ ! -s schema.sql ] || [ ! -s data.sql ]; then
            echo "Error: Los archivos de backup no se generaron correctamente o están vacíos"
            exit 1
          fi
          
          echo "Backup de estructura y datos completado exitosamente"
          ls -lh schema.sql data.sql
      
      - name: Compress Backup
        run: |
          # Comprimir ambos archivos en un solo tar.gz con fecha
          tar -czvf backup-$(date +%Y-%m-%d).tar.gz schema.sql data.sql
          
          # Verificar que la compresión se creó correctamente
          if [ ! -s backup-$(date +%Y-%m-%d).tar.gz ]; then
            echo "Error: El archivo comprimido está vacío o no se creó"
            exit 1
          fi
          
          echo "Compresión completada exitosamente"
          ls -lh backup-*.tar.gz
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: backup-*.tar.gz
          retention-days: 90
          if-no-files-found: error
